name: E2E

# Real-browser smoke tests (Playwright) against the production build. Runs on
# pull requests once they are marked ready for review. Kept separate from the
# deploy gate for now because browser E2E is inherently slower/flakier than
# unit tests; promote to a required check once it has proven stable.
#
# Draft PRs are skipped: this is the most expensive workflow in the repo
# (Playwright + Chromium install on every run) and the private repo's metered
# Actions minutes ran out on 2026-10-31, which stopped every workflow including
# the migration push. Marking a PR "Ready for review" triggers the run.
#
# Runs on the self-hosted runner (deploy/setup-runner.sh) when the CI_RUNS_ON
# repository variable is set — the box has Chromium's system libraries and the
# AWS CLI pre-installed, so the job needs no sudo there. Without the variable
# it falls back to GitHub-hosted runners. See docs/ci-runner.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event.pull_request.draft == false
    # Self-hosted when the CI_RUNS_ON repository variable is set (to the JSON
    # label list the runner was registered with, e.g.
    # ["self-hosted","linux","x64","cardpop-ci"]); GitHub-hosted otherwise.
    # Jobs on the self-hosted box bill no metered minutes — docs/ci-runner.md.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache the downloaded browser binary across runs (keyed on the lockfile,
      # which pins the Playwright version) so we don't re-fetch ~50 MB of
      # Chromium every run. --with-deps still runs so the apt libs are present.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      # The hosted runner image periodically ships broken Microsoft apt repos
      # (azure-cli / prod) whose InRelease signatures fail to verify. The
      # `apt-get update` that `playwright install --with-deps` runs then aborts
      # with exit 100 ("repository is no longer signed" / "Clearsigned file
      # isn't valid, got 'NOSPLIT'"), failing the browser install. Those repos
      # aren't needed for Chromium's system libraries, so drop them first.
      - name: Remove broken Microsoft apt repos
        if: runner.environment == 'github-hosted'
        run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*

      # GitHub runners don't have the browser pre-installed (this repo's dev
      # sandbox does), so fetch it here. --with-deps needs sudo for the system
      # libraries, which only the hosted image grants; the self-hosted box has
      # them pre-installed by deploy/setup-runner.sh and gets the browser only.
      - name: Install Playwright Chromium
        if: runner.environment == 'github-hosted'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium (self-hosted)
        if: runner.environment == 'self-hosted'
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # Reports go to S3 instead of GitHub artifacts. Fork PRs can't mint an
      # id-token, so the upload is skipped gracefully on those.
      - name: Configure AWS credentials (OIDC)
        if: failure()
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Upload report to S3 on failure
        if: failure() && steps.aws.outcome == 'success'
        run: |
          dest="s3://${{ vars.AWS_CI_ARTIFACTS_BUCKET }}/e2e/${{ github.run_id }}-${{ github.run_attempt }}/"
          aws s3 cp playwright-report/ "$dest" --recursive
          echo "Playwright report uploaded to $dest"
