name: E2E

# Real-browser smoke tests (Playwright) against the production build. Runs on
# pull requests. Kept separate from the deploy gate for now because browser E2E
# is inherently slower/flakier than unit tests; promote to a required check once
# it has proven stable.

on:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # GitHub runners don't have the browser pre-installed (this repo's dev
      # sandbox does), so fetch it here.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
