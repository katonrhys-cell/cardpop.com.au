name: E2E

# Real-browser smoke tests (Playwright) against the production build. Runs on
# pull requests. Kept separate from the deploy gate for now because browser E2E
# is inherently slower/flakier than unit tests; promote to a required check once
# it has proven stable.

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache the downloaded browser binary across runs (keyed on the lockfile,
      # which pins the Playwright version) so we don't re-fetch ~50 MB of
      # Chromium every run. --with-deps still runs so the apt libs are present.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      # GitHub runners don't have the browser pre-installed (this repo's dev
      # sandbox does), so fetch it here.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # Reports go to S3 instead of GitHub artifacts. Fork PRs can't mint an
      # id-token, so the upload is skipped gracefully on those.
      - name: Configure AWS credentials (OIDC)
        if: failure()
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Upload report to S3 on failure
        if: failure() && steps.aws.outcome == 'success'
        run: |
          dest="s3://${{ vars.AWS_CI_ARTIFACTS_BUCKET }}/e2e/${{ github.run_id }}-${{ github.run_attempt }}/"
          aws s3 cp playwright-report/ "$dest" --recursive
          echo "Playwright report uploaded to $dest"
