name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npx vite build --outDir dist
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Set dist file permissions
        run: |
          find ./dist -type f -exec chmod 644 {} \;
          find ./dist -type d -exec chmod 755 {} \;

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy to Hostinger via lftp
        timeout-minutes: 15
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set ftp:use-feat no;
            set net:timeout 60;
            set net:max-retries 10;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1.5;
            open -u $FTP_USERNAME,$FTP_PASSWORD ftp://$FTP_SERVER;
            mirror --reverse --parallel=4 --no-perms --exclude '.builds' --exclude 'cgi-bin' --exclude 'logs' --exclude 'tmp' ./dist/ /;
            quit
          "
