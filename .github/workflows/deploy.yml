name: Deploy to Vercel

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

# Only one deploy per branch at a time. A newer push cancels older in-progress
# or queued runs, so several merges in quick succession collapse to a single
# deploy of the latest commit instead of piling up behind the self-hosted runner.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single quality gate: one checkout + one `npm ci`, then lint, the full test
  # suite, build and the bundle budget run sequentially. Previously these were
  # four separate jobs (lint / test-frontend / test-backend / build), each doing
  # its own `npm ci` — ~4× the install cost per push for no extra coverage.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle-size budget
        run: npm run check:bundle

  # No e2e job on the main-push path. Browser E2E already runs on every pull
  # request (e2e.yml) as the merge gate, so re-running the slow Playwright suite
  # on the post-merge push to main just duplicated it and burned Actions
  # minutes. Deploy now gates on `verify` only; if a merge could land code that
  # skipped PR e2e (e.g. a direct push to main), rely on branch protection to
  # require the PR e2e check instead of re-running it here.
  deploy:
    needs: [verify]
    runs-on: ubuntu-latest
    # OIDC: the job mints a short-lived token GitHub signs, AWS trusts it, and we
    # assume an IAM role for temporary credentials — no long-lived AWS keys here.
    permissions:
      id-token: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Always deploy the current tip of main, NOT the commit that triggered this
      # run (github.sha). When several PRs merge within minutes, their deploy jobs
      # race — and because each used to check out its own commit, whichever job
      # finished last re-aliased production to *its* (possibly older) commit,
      # silently rolling production back. (This is exactly how production once got
      # stuck on an ancestor commit: a later-finishing older run won the alias.)
      # Pinning the checkout to `main` means every deploy — original, re-run, or
      # manual redeploy of an old run — publishes the latest main, so a lagging
      # run can only ever re-publish HEAD, never regress it.
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Load Vercel secrets from SSM Parameter Store
        run: |
          token=$(aws ssm get-parameter --name /cardpop/vercel/token --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::$token"
          {
            echo "VERCEL_TOKEN=$token"
            echo "VERCEL_ORG_ID=$(aws ssm get-parameter --name /cardpop/vercel/org_id --query 'Parameter.Value' --output text)"
            echo "VERCEL_PROJECT_ID=$(aws ssm get-parameter --name /cardpop/vercel/project_id --query 'Parameter.Value' --output text)"
          } >> "$GITHUB_ENV"

      - name: Deploy to Vercel
        run: vercel --prod --token="$VERCEL_TOKEN"
