name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npx vite build --outDir dist
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ── Generate .env for the backend ──────────────────────────────────────
      # Secrets are injected via env vars so special characters in values
      # are handled safely (no heredoc quoting issues).
      - name: Generate backend .env file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PB_SUPERUSER_EMAIL: ${{ secrets.PB_SUPERUSER_EMAIL }}
          PB_SUPERUSER_PASSWORD: ${{ secrets.PB_SUPERUSER_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
        run: |
          printf 'SUPABASE_URL=%s\n'              "$SUPABASE_URL"              >> .env
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY" >> .env
          printf 'VITE_SUPABASE_URL=%s\n'         "$VITE_SUPABASE_URL"         >> .env
          printf 'VITE_SUPABASE_ANON_KEY=%s\n'    "$VITE_SUPABASE_ANON_KEY"    >> .env
          printf 'PB_SUPERUSER_EMAIL=%s\n'        "$PB_SUPERUSER_EMAIL"        >> .env
          printf 'PB_SUPERUSER_PASSWORD=%s\n'     "$PB_SUPERUSER_PASSWORD"     >> .env
          printf 'STRIPE_SECRET_KEY=%s\n'         "$STRIPE_SECRET_KEY"         >> .env
          printf 'STRIPE_WEBHOOK_SECRET=%s\n'     "$STRIPE_WEBHOOK_SECRET"     >> .env
          printf 'EBAY_APP_ID=%s\n'               "$EBAY_APP_ID"               >> .env
          printf 'EBAY_CLIENT_SECRET=%s\n'        "$EBAY_CLIENT_SECRET"        >> .env
          printf 'APP_URL=%s\n'                   "$APP_URL"                   >> .env
          printf 'CORS_ORIGIN=%s\n'               "$CORS_ORIGIN"               >> .env

      - name: Set dist file permissions
        run: |
          find ./dist -type f -exec chmod 644 {} \;
          find ./dist -type d -exec chmod 755 {} \;

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy to Hostinger via lftp
        timeout-minutes: 15
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            set ftp:use-feat no;
            set net:timeout 60;
            set net:max-retries 10;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1.5;
            open -u $FTP_USERNAME,$FTP_PASSWORD ftp://$FTP_SERVER;
            put .env -o .env;
            mirror --reverse --parallel=4 --no-perms --exclude '.builds' --exclude 'cgi-bin' --exclude 'logs' --exclude 'tmp' ./dist/ /;
            quit
          "
