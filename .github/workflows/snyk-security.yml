name: Snyk Security Scan

# Scoped to main pushes + a weekly sweep instead of every PR: per-PR dependency
# scanning is already provided by the Snyk GitHub App (the `security/snyk`
# status check), so the per-PR workflow run (checkout + npm ci + scan) was
# redundant and burned Actions minutes / Snyk test quota.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  snyk:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fork PRs can't mint an id-token, so this step (and the scan) is skipped
      # gracefully rather than failing the job.
      - name: Configure AWS credentials (OIDC)
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Load Snyk token from SSM Parameter Store
        if: steps.aws.outcome == 'success'
        run: |
          # The token is optional. If the parameter isn't set in SSM, leave
          # SNYK_TOKEN empty and let the next step skip the scan — don't fail.
          if token=$(aws ssm get-parameter --name /cardpop/snyk/token --with-decryption --query 'Parameter.Value' --output text 2>/dev/null); then
            echo "::add-mask::$token"
            echo "SNYK_TOKEN=$token" >> "$GITHUB_ENV"
          else
            echo "::notice::/cardpop/snyk/token not set in SSM — skipping Snyk scan."
          fi

      - name: Skip scan — SNYK_TOKEN not available
        if: env.SNYK_TOKEN == ''
        run: |
          echo "::warning::SNYK_TOKEN unavailable (SSM unreachable or fork PR without OIDC) — skipping vulnerability scan."

      - name: Run Snyk vulnerability test
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high

      - name: Monitor project in Snyk dashboard
        if: env.SNYK_TOKEN != '' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: snyk/actions/node@master
        with:
          command: monitor
