name: Snyk Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  snyk:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fork PRs can't mint an id-token, so this step (and the scan) is skipped
      # gracefully rather than failing the job.
      - name: Configure AWS credentials (OIDC)
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Load Snyk token from SSM Parameter Store
        if: steps.aws.outcome == 'success'
        run: |
          token=$(aws ssm get-parameter --name /cardpop/snyk/token --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::$token"
          echo "SNYK_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Skip scan — SNYK_TOKEN not available
        if: env.SNYK_TOKEN == ''
        run: |
          echo "::warning::SNYK_TOKEN unavailable (SSM unreachable or fork PR without OIDC) — skipping vulnerability scan."

      - name: Run Snyk vulnerability test
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high

      - name: Monitor project in Snyk dashboard
        if: env.SNYK_TOKEN != '' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: snyk/actions/node@master
        with:
          command: monitor
