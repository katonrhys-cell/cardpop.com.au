name: Snyk Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Skip scan — SNYK_TOKEN not configured
        if: env.SNYK_TOKEN == ''
        run: |
          echo "::warning::SNYK_TOKEN secret is not configured. Add it in GitHub Settings → Secrets to enable vulnerability scanning."

      - name: Run Snyk vulnerability test
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high

      - name: Monitor project in Snyk dashboard
        if: env.SNYK_TOKEN != '' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: snyk/actions/node@master
        with:
          command: monitor
