name: Cron · Supplier price watch

# Re-checks the supplier page saved against each shop product (Admin →
# Products → Supplier link) and bells admins when a price changes. Runs daily
# but each product is only checked once a week — whichever have come due since
# their last check — so the work is spread out and a run with nothing due
# returns in about a second. Reports only; it never changes a price.
# Runbook: docs/supplier-price-watch.md.

on:
  schedule:
    # 20:17 UTC = 06:17 AEST. Off the top of the hour, where GitHub's scheduler
    # is most congested, and clear of the 19:30 price refresh.
    - cron: '17 20 * * *'
  workflow_dispatch:

concurrency:
  group: cron-supplier-price-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/cron-job.yml
    with:
      endpoint: /api/shop-supplier-watch/run
      # api/index.js is capped at maxDuration 40; the run stops starting new
      # pages after 25s, so allow a little headroom over the cap.
      max_seconds: 50
      # A product checked once isn't due again for a week, so a retry only
      # picks up what the first attempt didn't reach.
      attempts: 2
    secrets: inherit
