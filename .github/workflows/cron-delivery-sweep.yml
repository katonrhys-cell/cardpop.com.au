name: Cron · Delivery sweep

# Closes the loop on shipped orders. For every order marked shipped with no
# delivery recorded it asks the carrier (Australia Post / StarTrack / Sendle,
# where API credentials exist in Vercel) and, failing that, records delivery
# 10 days after posting (utils/buyerProtectionPolicy.js). Delivery moves the
# order to 'completed', emails the buyer (with the 7-day Buyer Protection
# window and a review nudge) and starts that window. Runbook:
# docs/order-delivery.md.

on:
  schedule:
    # 20:37 UTC = 06:37 AEST, after the supplier watch, off the hour.
    - cron: '37 20 * * *'
  workflow_dispatch:

concurrency:
  group: cron-delivery-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/cron-job.yml
    with:
      endpoint: /api/orders/delivery-sweep
      # api/index.js is capped at maxDuration 40; the sweep stops after 25s.
      max_seconds: 50
      # Idempotent — a delivered order is skipped on a retry.
      attempts: 2
    secrets: inherit
