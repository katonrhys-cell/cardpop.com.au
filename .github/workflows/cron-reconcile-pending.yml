name: Cron · Reconcile pending payments

# Asks Stripe whether any still-'pending' order was in fact paid — the case
# where the buyer's money left their account but checkout.session.completed
# never reached the webhook, so nothing was fulfilled and no error was raised
# anywhere. Reports to Sentry and the admin notification bell; it never fulfils,
# because replaying the missed event moves money and stays a deliberate act in
# the Stripe dashboard.
#
# Replaces the vercel.json cron { "/api/stripe/reconcile-pending", "15 21 * * *" }.
#
# That daily cadence was forced by Vercel's Hobby plan, not chosen: a sub-daily
# schedule fails the whole deployment build there. Nothing caps it here, so it
# now runs every two hours — a stuck payment is caught within ~2 hours instead
# of up to 24. It is deliberately not hourly: this repo is private, so Actions
# minutes are metered and each run bills as a full minute (~360/month at this
# cadence, ~720 hourly). To go hourly, change the schedule to '15 * * * *'.

on:
  schedule:
    # Every 2 hours at :15 past.
    - cron: '15 */2 * * *'
  workflow_dispatch:

concurrency:
  group: cron-reconcile-pending
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/cron-job.yml
    with:
      endpoint: /api/stripe/reconcile-pending
      max_seconds: 50
      # Read-only against Stripe, and notifications dedupe on related_id, so a
      # retry can't double-report.
      attempts: 2
    secrets: inherit
