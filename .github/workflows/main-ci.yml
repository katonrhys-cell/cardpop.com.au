name: Main CI

# Post-merge quality gate for main: lint + the full test suite (with a
# coverage-threshold gate, floors in vitest.config.js) + build + bundle budget.
# Deployment is handled by Vercel's native Git integration (Vercel builds and
# deploys on every push to main), so this workflow no longer runs `vercel --prod`.
#
# Removed with the move to Vercel Git deploys: the old `deploy` job that
# installed the Vercel CLI, assumed an AWS IAM role via OIDC, and read the
# Vercel token from SSM Parameter Store — all obsolete now. The AWS role and the
# /cardpop/vercel/* SSM parameters can be deleted separately (AWS-side cleanup).
#
# Browser E2E runs on pull requests (e2e.yml), not here.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

# One run per ref; a newer push cancels older in-progress/queued runs so a burst
# of merges collapses to a single verify of the latest commit.
concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single quality gate: one checkout + one `npm ci`, then lint, the full test
  # suite, build and the bundle budget run sequentially. Previously these were
  # four separate jobs (lint / test-frontend / test-backend / build), each doing
  # its own `npm ci` — ~4× the install cost per push for no extra coverage.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (with coverage gate)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle-size budget
        run: npm run check:bundle
