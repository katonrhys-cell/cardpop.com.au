name: CI

# Runs lint + the full test suite (with a coverage-threshold gate) + a
# production build on every pull request. This is the PR gate — enable it as a
# required status check in branch protection so a red build can't be merged.
# Coverage floors live in vitest.config.js (test.coverage.thresholds).
#
# NOTE: intentionally PR-only, and the ONLY place the suite runs. `main` is
# only ever changed by merging a PR that passed this job, so the former
# post-merge copy (`main-ci.yml`) re-ran the identical lint/test/build on the
# same tree — ~6 billed minutes per merge on a private repo for no new
# information. Deployment is Vercel's own Git integration, which builds on
# every push to main regardless. If main ever needs re-verifying, trigger
# this job by opening a PR; there is no push trigger on purpose.

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A hung step must not run to the 6-hour default and eat the Actions budget.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (with coverage gate)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle-size budget
        run: npm run check:bundle
