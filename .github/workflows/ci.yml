name: CI

# The PR gate, in ONE job: migration-version check, lint, the full test suite
# (with a coverage-threshold gate), a production build, the bundle budget and,
# once the PR is ready for review, the Playwright E2E smoke tests against that
# same build. Enable `verify` as a required status check in branch protection.
# Coverage floors live in vitest.config.js (test.coverage.thresholds).
#
# One job on purpose: GitHub bills every job on a private repo rounded UP to
# the whole minute, and the E2E and migration-check workflows each paid for
# their own checkout + `npm ci` (+ a second build for E2E). Folding them in
# saves those minutes on every PR push (efficiency review, 2026-11).
#
# NOTE: intentionally PR-only, and the ONLY place the suite runs. `main` is
# only ever changed by merging a PR that passed this job, so a post-merge copy
# would re-run the identical checks on the same tree for no new information.
# Deployment is Vercel's own Git integration. There is no push trigger on
# purpose.
#
# Draft PRs skip the E2E steps (the most expensive part: a Chromium install
# and a real browser run); marking the PR "Ready for review" re-runs this job
# with them.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # E2E failure reports are uploaded to S3 via OIDC

jobs:
  verify:
    runs-on: ubuntu-latest
    # A hung step must not run to the 6-hour default and eat the Actions budget.
    timeout-minutes: 30
    env:
      # Hosted runners have 4 vCPUs; the vitest.config.js default (half the
      # cores) was written for a low-core self-hosted machine.
      VITEST_MAX_FORKS: '4'
      E2E: ${{ github.event.pull_request.draft == false }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Two branches picking the same version prefix has broken `db push`
      # twice — the version is the PRIMARY KEY of schema_migrations, so the
      # second file can never be applied. Catch it before merge.
      - name: Fail on duplicate migration version prefixes
        run: |
          dups=$(ls supabase/migrations | grep -oE '^[0-9]+' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::Duplicate migration version prefix(es): $dups"
            echo "Each migration needs a unique version — rename one file (e.g. bump to the current timestamp)."
            exit 1
          fi
          echo "All migration versions unique."

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (with coverage gate)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle-size budget
        run: npm run check:bundle

      # ── E2E (ready-for-review PRs only) ──────────────────────────────────
      # Keyed on the installed Playwright version, not the whole lockfile, so
      # an unrelated dependency bump no longer re-downloads Chromium.
      - name: Playwright version
        if: env.E2E == 'true'
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: env.E2E == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # The hosted runner image periodically ships broken Microsoft apt repos
      # whose InRelease signatures fail to verify, which aborts the
      # `apt-get update` inside `playwright install --with-deps`. They aren't
      # needed for Chromium's system libraries, so drop them first.
      - name: Remove broken Microsoft apt repos
        if: env.E2E == 'true'
        run: sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*

      - name: Install Playwright Chromium
        if: env.E2E == 'true'
        run: npx playwright install --with-deps chromium

      # E2E_SKIP_BUILD: serve the dist/ built above instead of building again.
      - name: Run E2E tests
        if: env.E2E == 'true'
        env:
          E2E_SKIP_BUILD: '1'
        run: npm run test:e2e

      # Reports go to S3 instead of GitHub artifacts. Fork PRs can't mint an
      # id-token, so the upload is skipped gracefully on those.
      - name: Configure AWS credentials (OIDC)
        if: failure() && env.E2E == 'true'
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Upload E2E report to S3 on failure
        if: failure() && env.E2E == 'true' && steps.aws.outcome == 'success'
        run: |
          dest="s3://${{ vars.AWS_CI_ARTIFACTS_BUCKET }}/e2e/${{ github.run_id }}-${{ github.run_attempt }}/"
          aws s3 cp playwright-report/ "$dest" --recursive
          echo "Playwright report uploaded to $dest"
