name: CI

# Runs lint + the full test suite + a production build on every pull request.
# This is the PR gate — enable it as a required status check in branch
# protection so a red build can't be merged.
#
# NOTE: intentionally PR-only. Pushes to main are covered by the equivalent
# `verify` job in deploy.yml (which then deploys), so running this on main too
# would just duplicate the whole suite and burn Actions minutes twice.

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle-size budget
        run: npm run check:bundle
