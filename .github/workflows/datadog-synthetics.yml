# Runs Datadog Synthetic tests after every deployment to main.
# Requires DD_API_KEY and DD_APP_KEY to be set in GitHub repo secrets.
# See: https://docs.datadoghq.com/synthetics/cicd_integrations/github_actions/

name: Run Datadog Synthetic tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  datadog-synthetics:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Skip tests — DD_API_KEY not configured
        if: env.DD_API_KEY == ''
        run: |
          echo "::warning::DD_API_KEY secret is not configured. Add DD_API_KEY and DD_APP_KEY in GitHub Settings → Secrets to enable Datadog synthetic tests."

      - name: Run Datadog Synthetic tests
        if: env.DD_API_KEY != ''
        continue-on-error: true
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ env.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'
