name: Git backup

# Zips the entire repository (including full git history) and uploads the
# archive off-site to AWS S3 and/or Google Drive. This is a disaster-recovery
# safety net that is independent of GitHub: if the GitHub repo is ever lost,
# deleted, or corrupted, the zip is a complete, restorable clone.
#
# Runs once a day on a schedule and can be triggered on demand from the
# Actions tab (Run workflow). Each upload step is self-guarding: it only runs
# when its secrets are configured, so you can set up one destination now and
# the other later without the workflow failing.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions).
# Configure the S3 group, the Google Drive group, or both:
#
#   --- AWS S3 ---
#   BACKUP_AWS_ACCESS_KEY_ID      Access key for an IAM user/role scoped to
#                                 s3:PutObject on the target bucket/prefix.
#   BACKUP_AWS_SECRET_ACCESS_KEY  The matching secret access key.
#   BACKUP_S3_BUCKET              Destination as "bucket" or "bucket/prefix"
#                                 (e.g. cardpop-backups/git).
#   BACKUP_AWS_REGION             (optional) Bucket region, default ap-southeast-2.
#
#   --- Google Drive ---
#   BACKUP_GDRIVE_SERVICE_ACCOUNT The full JSON key of a GCP service account
#                                 (Drive API enabled). Paste the file contents.
#   BACKUP_GDRIVE_FOLDER_ID       ID of the destination folder (the part of the
#                                 folder URL after /folders/). See docs/git-backup.md
#                                 for the Shared Drive requirement.
#
# Full setup walkthrough: docs/git-backup.md

on:
  schedule:
    # 18:15 UTC daily = 04:15 / 05:15 in Australia (AEST/AEDT). Off the hour to
    # avoid the cron rush when many repos fire at :00.
    - cron: '15 18 * * *'
  workflow_dispatch:

# Don't let a manual run collide with the scheduled one.
concurrency:
  group: git-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          # fetch-depth: 0 pulls every commit + tag so the zip is a complete,
          # independent backup rather than a shallow snapshot.
          fetch-depth: 0

      - name: Create repository archive
        id: archive
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%d-%H%M%S)
          name="cardpop-backup-${stamp}.zip"
          # Zip the working tree AND the .git directory (full history), so the
          # archive can be unzipped into a working clone. Exclude generated /
          # installed artifacts that are cheap to rebuild and only bloat the zip.
          zip -r -q "/tmp/${name}" . \
            -x '*/node_modules/*' 'node_modules/*' \
            -x '*/dist/*' 'dist/*' \
            -x '*/.vercel/*' '.vercel/*' \
            -x 'coverage/*' 'playwright-report/*' 'test-results/*'
          size=$(du -h "/tmp/${name}" | cut -f1)
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "path=/tmp/${name}" >> "$GITHUB_OUTPUT"
          echo "Created ${name} (${size})"

      # --- AWS S3 ---------------------------------------------------------
      - name: Upload to AWS S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_AWS_REGION || 'ap-southeast-2' }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.S3_BUCKET != '' }}
        run: |
          set -euo pipefail
          # aws CLI is pre-installed on ubuntu-latest runners.
          aws s3 cp "${{ steps.archive.outputs.path }}" \
            "s3://${S3_BUCKET}/${{ steps.archive.outputs.name }}"
          echo "Uploaded to s3://${S3_BUCKET}/${{ steps.archive.outputs.name }}"

      - name: Skip note (S3 not configured)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        if: ${{ env.AWS_ACCESS_KEY_ID == '' || env.S3_BUCKET == '' }}
        run: echo "::notice::S3 secrets not set — skipping S3 upload."

      # --- Google Drive ---------------------------------------------------
      - name: Upload to Google Drive
        env:
          GDRIVE_SA: ${{ secrets.BACKUP_GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.BACKUP_GDRIVE_FOLDER_ID }}
        if: ${{ env.GDRIVE_SA != '' && env.GDRIVE_FOLDER_ID != '' }}
        run: |
          set -euo pipefail
          # rclone speaks Drive natively and authenticates from a service
          # account file — no interactive OAuth needed.
          curl -fsSL https://rclone.org/install.sh | sudo bash
          printf '%s' "$GDRIVE_SA" > /tmp/gdrive-sa.json
          # Configure the remote entirely through env vars (no config file).
          export RCLONE_CONFIG_GDRIVE_TYPE=drive
          export RCLONE_CONFIG_GDRIVE_SCOPE=drive
          export RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE=/tmp/gdrive-sa.json
          export RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID="$GDRIVE_FOLDER_ID"
          rclone copy "${{ steps.archive.outputs.path }}" gdrive: \
            --drive-use-trash=false --stats-one-line
          rm -f /tmp/gdrive-sa.json
          echo "Uploaded ${{ steps.archive.outputs.name }} to Google Drive folder ${GDRIVE_FOLDER_ID}"

      - name: Skip note (Google Drive not configured)
        env:
          GDRIVE_SA: ${{ secrets.BACKUP_GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.BACKUP_GDRIVE_FOLDER_ID }}
        if: ${{ env.GDRIVE_SA == '' || env.GDRIVE_FOLDER_ID == '' }}
        run: echo "::notice::Google Drive secrets not set — skipping Drive upload."

      - name: Fail if no destination is configured
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          GDRIVE_SA: ${{ secrets.BACKUP_GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.BACKUP_GDRIVE_FOLDER_ID }}
        if: ${{ (env.AWS_ACCESS_KEY_ID == '' || env.S3_BUCKET == '') && (env.GDRIVE_SA == '' || env.GDRIVE_FOLDER_ID == '') }}
        run: |
          echo "::error::No backup destination configured. Set the S3 secrets, the Google Drive secrets, or both — see docs/git-backup.md."
          exit 1
