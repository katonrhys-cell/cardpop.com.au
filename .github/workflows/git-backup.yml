name: Git backup

# Zips the entire repository (including full git history) and uploads the
# archive off-site to Google Drive. This is a disaster-recovery safety net that
# is independent of GitHub: if the GitHub repo is ever lost, deleted, or
# corrupted, the zip is a complete, restorable clone.
#
# Runs once a day on a schedule and can be triggered on demand from the
# Actions tab (Run workflow).
#
# Uploads via rclone using an OAuth refresh token for the Google Workspace
# account (admin@cardpop.com.au), so backups land straight in the existing
# Drive "Website backups" folder — no Google Cloud project or service account.
#
# Required repository secret (Settings -> Secrets and variables -> Actions):
#   RCLONE_CONFIG_BASE64   base64 of a rclone.conf that defines a remote named
#                          `gdrive` (type: drive) with an OAuth token for
#                          admin@cardpop.com.au. Generate it locally with
#                          `rclone config` — full walkthrough in docs/git-backup.md.
#
# Optional repository variable (Settings -> Secrets and variables -> Actions -> Variables):
#   GDRIVE_BACKUP_DEST     rclone destination, "remote:folder" form.
#                          Defaults to "gdrive:Website backups".
#
# Full setup walkthrough: docs/git-backup.md

on:
  schedule:
    # 18:15 UTC daily = 04:15 / 05:15 in Australia (AEST/AEDT). Off the hour to
    # avoid the cron rush when many repos fire at :00.
    - cron: '15 18 * * *'
  workflow_dispatch:

# Don't let a manual run collide with the scheduled one.
concurrency:
  group: git-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          # fetch-depth: 0 pulls every commit + tag so the zip is a complete,
          # independent backup rather than a shallow snapshot.
          fetch-depth: 0

      - name: Create repository archive
        id: archive
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%d-%H%M%S)
          name="cardpop-backup-${stamp}.zip"
          # Zip the working tree AND the .git directory (full history), so the
          # archive can be unzipped into a working clone. Exclude generated /
          # installed artifacts that are cheap to rebuild and only bloat the zip.
          zip -r -q "/tmp/${name}" . \
            -x '*/node_modules/*' 'node_modules/*' \
            -x '*/dist/*' 'dist/*' \
            -x '*/.vercel/*' '.vercel/*' \
            -x 'coverage/*' 'playwright-report/*' 'test-results/*'
          size=$(du -h "/tmp/${name}" | cut -f1)
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "path=/tmp/${name}" >> "$GITHUB_OUTPUT"
          echo "Created ${name} (${size})"

      - name: Upload to Google Drive
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          DEST: ${{ vars.GDRIVE_BACKUP_DEST || 'gdrive:Website backups' }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_BASE64}" ]; then
            echo "::error::RCLONE_CONFIG_BASE64 secret not set. Configure it — see docs/git-backup.md."
            exit 1
          fi

          # Install a current rclone (the distro package lags). The official
          # installer is the documented, maintained method.
          curl -fsSL https://rclone.org/install.sh | sudo bash

          # Materialise the rclone config from the secret. base64 keeps the
          # multi-line token JSON intact through the secrets pipeline.
          mkdir -p "$HOME/.config/rclone"
          # Strip any whitespace/line-wrapping the secret may carry (some base64
          # tools wrap at 76 cols) before decoding, so a slightly-formatted secret
          # still works.
          printf '%s' "${RCLONE_CONFIG_BASE64}" | tr -d '[:space:]' | base64 -d > "$HOME/.config/rclone/rclone.conf"

          # Upload the archive. --drive-chunk-size keeps memory modest for the
          # ~80 MB zip; rclone refreshes the OAuth token automatically.
          rclone copy "${{ steps.archive.outputs.path }}" "${DEST}" \
            --drive-chunk-size 16M --stats-one-line -v
          echo "Uploaded ${{ steps.archive.outputs.name }} to ${DEST}"

          # Retention: prune CardPop backup zips older than 30 days so the Drive
          # folder doesn't grow without bound. Scoped by filename so anything
          # else in the folder is left untouched. --drive-use-trash=false frees
          # the space immediately instead of parking it in Trash for 30 days.
          rclone delete "${DEST}" \
            --min-age 30d --include 'cardpop-backup-*.zip' \
            --drive-use-trash=false -v || true
