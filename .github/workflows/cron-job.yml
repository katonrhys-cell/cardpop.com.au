name: Scheduled job

# Reusable runner for CardPop's scheduled backend jobs that need their OWN run:
# the every-two-hours payment reconciler and the two model-spending jobs (blog
# generation, the weekly event scan). The six daily maintenance endpoints
# share one run instead — see cron-daily.yml.
#
# These used to be `crons` entries in vercel.json. Vercel's Hobby plan rejects
# any cron firing more than once a day — a sub-daily schedule fails the entire
# deployment build, which is how it once silently blocked every production
# deploy — so the stuck-payment reconciler sat on a daily schedule even though
# it wants to run far more often. GitHub Actions has no such limit, so the
# schedules live here and vercel.json carries no `crons` block at all.
#
# Each job is one authenticated GET against the production API (the composite
# action .github/actions/cron-call). Nothing is built and no toolchain is
# installed: the only checkout is a sparse one for that action's own file.
# Keeping it to a single call matters on a private repo, where Actions minutes
# are metered and every run is billed rounded up to a whole minute — see
# docs/scheduled-jobs.md.
#
# The endpoints authenticate with CRON_SECRET and all fail closed, so this
# workflow is not a privilege boundary: without the secret nothing runs.

on:
  workflow_call:
    inputs:
      endpoint:
        description: Site-absolute path to call, e.g. /api/prices/refresh
        required: true
        type: string
      max_seconds:
        description: Per-attempt timeout. Match the function's maxDuration in vercel.json.
        required: false
        default: 60
        type: number
      attempts:
        description: >
          How many times to try before failing. Keep at 1 for jobs that spend
          money on a model call — a retry can double-spend on a run that
          actually succeeded but answered slowly.
        required: false
        default: 1
        type: number
    secrets:
      CRON_SECRET:
        required: true

permissions:
  contents: read

jobs:
  call:
    name: ${{ inputs.endpoint }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Only the composite action's directory — a local action needs the file on
      # disk, and a sparse checkout of one folder takes a second.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/cron-call
        with:
          endpoint: ${{ inputs.endpoint }}
          max_seconds: ${{ inputs.max_seconds }}
          attempts: ${{ inputs.attempts }}
          # Override with a repository variable to point the jobs at a preview
          # deployment; unset means production.
          base_url: ${{ vars.CRON_BASE_URL || 'https://cardpop.com.au' }}
          cron_secret: ${{ secrets.CRON_SECRET }}
