name: Lighthouse

# Lab Core Web Vitals + a11y/SEO/best-practices against the production build.
# Runs on pull requests for both form factors (desktop + mobile). Budgets live in
# lighthouserc.cjs, calibrated per form factor. Kept as its own workflow (like
# e2e) because Lighthouse runs are slower and a little noisy; promote to a
# required check once it has proven stable.

# Disabled for now: this workflow runs `lhci`, but @lhci/cli has been removed
# from the project, so every automatic run fails the PR checks. Switched to
# manual-only (workflow_dispatch) until Lighthouse CI is reinstated; re-add the
# `pull_request` trigger here once @lhci/cli is back in devDependencies.
on:
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        form_factor: [desktop, mobile]
    name: lighthouse (${{ matrix.form_factor }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI (${{ matrix.form_factor }})
        env:
          LH_FORM_FACTOR: ${{ matrix.form_factor }}
        run: |
          # Resolve the Chromium binary Playwright just installed.
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          export CHROME_PATH
          echo "Using Chrome at: $CHROME_PATH (form factor: $LH_FORM_FACTOR)"
          lhci autorun --config=lighthouserc.cjs

      - name: Configure AWS credentials (OIDC)
        if: always()
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Upload Lighthouse reports to S3
        if: always() && steps.aws.outcome == 'success'
        run: |
          dest="s3://${{ vars.AWS_CI_ARTIFACTS_BUCKET }}/lighthouse/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.form_factor }}/"
          aws s3 cp .lighthouseci/ "$dest" --recursive
          echo "Lighthouse report uploaded to $dest"
