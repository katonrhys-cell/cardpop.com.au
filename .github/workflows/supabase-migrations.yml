name: Supabase migrations

# Applies any new files in supabase/migrations/ to the production database
# whenever they land on main. `supabase db push` only runs migrations whose
# version is not yet recorded in the project's schema_migrations table, so a
# push that changes no migrations is a fast no-op. This is what replaces
# hand-running SQL in the dashboard editor.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - a personal access token from
#                            https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   - the project's database password
#                            (Dashboard -> Project Settings -> Database)
#
# This runs independently of the Vercel deploy. Because it only needs a checkout
# + CLI (seconds) while the deploy waits on the verify + e2e gates (minutes),
# migrations almost always land before the app that depends on them. Keep
# migrations backward-compatible so either order is safe.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      # A change to how migrations are pushed is itself worth a push: it is
      # the only way a fix to this file gets proven on main.
      - '.github/workflows/supabase-migrations.yml'
  # The duplicate-version check also runs on every PR, as a step of CI's
  # verify job (.github/workflows/ci.yml), so PRs no longer bill a separate
  # one-minute job here.
  # Allow a manual re-run from the Actions tab if a push ever fails.
  workflow_dispatch:

# Never let two migration pushes overlap, and never cancel one mid-apply.
concurrency:
  group: supabase-migrations-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Fail on duplicate migration version prefixes
        run: |
          dups=$(ls supabase/migrations | grep -oE '^[0-9]+' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::Duplicate migration version prefix(es): $dups"
            echo "Each migration needs a unique version — rename one file (e.g. bump to the current timestamp)."
            exit 1
          fi
          echo "All migration versions unique."

  db-push:
    needs: check-versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Pinned, never `latest`: Supabase CLI 3.0.0 (2026-11) changed three
      # things under the same workflow at once — [inbucket] became [local_smtp]
      # in config.toml (#1127), `db push` / `migration list` started targeting
      # the LOCAL stack unless given --remote, and a non-interactive push now
      # refuses without --yes. `latest` picked all of that up silently and the
      # production push failed on every merge. Bump this deliberately, after
      # trying the new version against a throwaway database (docs in CLAUDE.md
      # → Supabase → Migrations).
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # --include-all: the 2026-07-03 hand-applied change (version
        # 20260703051406, see the placeholder migration of that name) sits
        # ABOVE several repo migrations that were never applied because every
        # push that day failed on the history-drift check. Without the flag the
        # CLI refuses to apply local migrations whose version is lower than the
        # newest remote one. All repo migrations are idempotent, so applying
        # stragglers out of order is safe.
        # --remote: CLI 3.x targets the local stack by default; this is the
        # linked production project. --yes: a merge to main IS the approval,
        # and without it a non-interactive push refuses and changes nothing.
        run: |
          supabase link --project-ref vrfsaazuqjxotnieqlkd
          supabase db push --include-all --remote --yes
