name: Supabase migrations

# Applies any new files in supabase/migrations/ to the production database
# whenever they land on main. `supabase db push` only runs migrations whose
# version is not yet recorded in the project's schema_migrations table, so a
# push that changes no migrations is a fast no-op. This is what replaces
# hand-running SQL in the dashboard editor.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - a personal access token from
#                            https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   - the project's database password
#                            (Dashboard -> Project Settings -> Database)
#
# This runs independently of the Vercel deploy. Because it only needs a checkout
# + CLI (seconds) while the deploy waits on the verify + e2e gates (minutes),
# migrations almost always land before the app that depends on them. Keep
# migrations backward-compatible so either order is safe.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  # Allow a manual re-run from the Actions tab if a push ever fails.
  workflow_dispatch:

# Never let two migration pushes overlap, and never cancel one mid-apply.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  db-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref odoglvswwymyjuwlonkf
          supabase db push
