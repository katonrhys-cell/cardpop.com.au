name: Cron · Event website re-scan

# Re-scans the "Website to scrape" an admin attached to an event. Each event's
# page is scanned when it's saved and then every seven days; this daily job
# picks up whichever events have come due (event_source_watches.next_scan_at),
# so each one is re-checked a week after its last scan rather than all at once.
# A scan fills in details the event is missing and queues changed dates/venue/
# price for an admin to apply — it never overwrites. An unchanged page skips the
# model call, and a run with nothing due returns in about a second.
# Runbook: docs/event-scanning.md → "Weekly re-scan of an event's website".

on:
  schedule:
    # 16:43 UTC = 02:43 AEST. Off the top of the hour, where GitHub's scheduler
    # is most congested, and clear of the Monday discovery scan at 17:07.
    - cron: '43 16 * * *'
  workflow_dispatch:

concurrency:
  group: cron-event-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/cron-job.yml
    with:
      endpoint: /cron/event-scan?mode=watches
      # api/event-scan.js runs on its own 300s function.
      max_seconds: 330
      # Each scan may spend on a model call; a due watch left over is simply
      # picked up tomorrow, so there's nothing to gain from a retry.
      attempts: 1
    secrets: inherit
