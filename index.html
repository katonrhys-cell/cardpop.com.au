
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#CE1126" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F2937" media="(prefers-color-scheme: dark)" />

    <!-- Hreflang tags for international SEO -->
    <link rel="alternate" hreflang="en-au" href="https://cardpop.online/" />
    <link rel="alternate" hreflang="en" href="https://cardpop.online/" />
    <link rel="alternate" hreflang="x-default" href="https://cardpop.online/" />

    <!-- Core Web Vitals optimization -->
    <link rel="preconnect" href="https://cardpop.online" />
    <link rel="dns-prefetch" href="https://cardpop.online" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/og-image.jpg" as="image" type="image/jpeg" />
    
    <!-- Prevent CLS with explicit dimensions -->
    <style>
      img { max-width: 100%; height: auto; }
    </style>

    <title>CardPop | Australia's Trading Card Marketplace</title>
    <meta name="description" content="Buy, sell, and trade Pokémon, Magic: The Gathering, sports cards and more on CardPop — Australia's most trusted trading card platform." />
    <meta name="keywords" content="trading cards Australia, Pokemon cards Australia, buy sell trade cards, MTG Australia, sports cards Australia, card marketplace" />
    <meta name="author" content="CardPop" />
    <link rel="canonical" href="https://cardpop.online/" />

    <!-- Google Fonts — preconnect first, then load Syne -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" /></noscript>

    <!-- Open Graph (Facebook, Discord, Slack previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cardpop.online/" />
    <meta property="og:site_name" content="CardPop" />
    <meta property="og:title" content="CardPop | Australia's Trusted Digital Card Show - Trading Card Marketplace" />
    <meta property="og:description" content="Buy, sell, and trade Pokémon, Magic: The Gathering, sports cards and more on CardPop — Australia's most trusted trading card platform." />
    <meta property="og:image" content="https://cardpop.online/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@cardpopau" />
    <meta name="twitter:title" content="CardPop | Australia's Trusted Digital Card Show - Trading Card Marketplace" />
    <meta name="twitter:description" content="Buy, sell, and trade Pokémon, Magic: The Gathering, sports cards and more on CardPop — Australia's most trusted trading card platform." />
    <meta name="twitter:image" content="https://cardpop.online/og-image.jpg" />

    <!-- Favicon — CardPop card-holder icon in brand red -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 68' fill='none'><rect x='17' y='0.5' width='22' height='11' rx='4' stroke='%23CE1126' stroke-width='2.5'/><rect x='20.5' y='3' width='15' height='5' rx='2' fill='%23CE1126' opacity='0.22'/><rect x='1.5' y='9' width='53' height='58' rx='6' stroke='%23CE1126' stroke-width='2.5'/><rect x='8' y='17' width='40' height='43' rx='4' stroke='%23CE1126' stroke-width='2'/><rect x='14' y='23' width='28' height='31' rx='2.5' stroke='%23CE1126' stroke-width='1.5' opacity='0.6'/></svg>" />

    <!-- Structured data: Website with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CardPop",
      "url": "https://cardpop.online",
      "description": "Australia's trading card marketplace for Pokémon, Magic: The Gathering, sports cards and more.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://cardpop.online/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CardPop",
      "url": "https://cardpop.online",
      "logo": "https://cardpop.online/og-image.jpg",
      "description": "Australia's most trusted trading card marketplace.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "AU"
      },
      "sameAs": [
        "https://twitter.com/cardpopau"
      ]
    }
    </script>

    <!-- Structured data: LocalBusiness for Australia -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "CardPop",
      "description": "Australia's most trusted trading card marketplace for Pokémon, Magic: The Gathering, sports cards and more.",
      "url": "https://cardpop.online",
      "telephone": "+61-400-000-000",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "AU",
        "addressRegion": "Australia"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "-25.2744",
        "longitude": "133.7751"
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": [
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
          "Sunday"
        ],
        "opens": "00:00",
        "closes": "23:59"
      },
      "priceRange": "$$"
    }
    </script>
  </head>

</html>
