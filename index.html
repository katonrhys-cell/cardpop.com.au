
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#CE1126" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F2937" media="(prefers-color-scheme: dark)" />
    <!-- Properly sized icons (source art: cardpop-favicon-icon.png, 1254px —
         referencing it directly shipped a 690 KB PNG on every page view). -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <!-- Installable PWA: manifest + iOS standalone hints. -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="CardPop">

    <!-- NO hreflang tags here: this document is served for every SPA route
         (copied to app.html at build), so static hreflang links pointing at
         "/" would declare the homepage as the alternate of every page —
         Search Console then reports those pages as "Alternate page with
         proper canonical tag" and drops them. Single-locale site: no hreflang. -->

    <!-- Core Web Vitals: preconnect only to origins used on first paint.
         Fonts are now self-hosted (same-origin) so no font-CDN preconnect is
         needed. Supabase is the first data origin the app hits. -->
    <link rel="preconnect" href="https://vrfsaazuqjxotnieqlkd.supabase.co" crossorigin />
    <!-- Preload the self-hosted Syne heading font (crossorigin required even
         same-origin — fonts fetch in CORS/anonymous mode). @font-face is in index.css.
         fetchpriority=high so the font beats the modulepreloaded JS chunks in the
         bandwidth race — @font-face uses font-display: fallback, so Syne arriving
         inside the ~100ms block window means the first paint needs no font swap.
         The same preload is also sent as a Link header on "/" (vercel.json) so
         Cloudflare Early Hints can start the fetch before the HTML body arrives. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/syne-latin-var.woff2" crossorigin fetchpriority="high" />
    
    <!-- Prevent CLS: width+height attrs + height:auto lets browser compute aspect-ratio before load -->
    <!-- Critical CSS: minimal above-the-fold styles to enable rendering without full CSS file -->
    <style>
      /* NOTE: the @font-face declarations for Syne and the metric-adjusted
         'Syne Fallback' live in index.css and are inlined into this critical
         CSS at build time (beasties `inlineFonts: true` in vite.config.js).
         They MUST be present in the shell so the hero <h1> (the LCP element)
         paints with the oversized fallback — see the comment in index.css. */

      /* Base styles — enable fast first paint */
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      }

      /* Images — prevent layout shift */
      img { max-width: 100%; height: auto; aspect-ratio: auto; }

      /* Typography — ensure text renders immediately */
      h1, h2, h3, h4, h5, h6 { font-family: 'Syne', 'Syne Fallback', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

      /* Hero section — above fold on desktop/tablet, stats on mobile */
      .min-h-\[92dvh\] { min-height: 92dvh; display: flex; align-items: flex-start; justify-content: center; }

      /* Flexbox for layout stability */
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .items-center { align-items: center; }
      .justify-center { justify-content: center; }

      /* Text classes for hero copy */
      .text-foreground { color: rgb(31, 41, 55); }
      .text-white { color: rgb(255, 255, 255); }
      .text-zinc-400 { color: rgb(161, 161, 170); }
      .bg-zinc-950 { background-color: rgb(9, 9, 11); }
      .bg-background { background-color: rgb(255, 255, 255); }
      .bg-card { background-color: rgb(255, 255, 255); }

      /* Spacing — critical for layout shift prevention */
      .pt-10 { padding-top: 2.5rem; }
      .pb-16 { padding-bottom: 4rem; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      .mb-6 { margin-bottom: 1.5rem; }
      .mb-8 { margin-bottom: 2rem; }
      .mb-10 { margin-bottom: 2.5rem; }
      .gap-4 { gap: 1rem; }

      /* Typography scale */
      .text-base { font-size: 1rem; }
      .text-lg { font-size: 1.125rem; }
      .text-5xl { font-size: 3rem; }
      .text-6xl { font-size: 3.75rem; }

      .font-bold { font-weight: 700; }
      .font-extrabold { font-weight: 800; }

      .text-balance { text-wrap: balance; }
      .text-center { text-align: center; }

      /* Container — max-width for content */
      .max-w-5xl { max-width: 64rem; }
      .mx-auto { margin-left: auto; margin-right: auto; }
      .w-full { width: 100%; }

      /* Buttons — visible immediately */
      .rounded-2xl { border-radius: 1rem; }
      .px-8 { padding-left: 2rem; padding-right: 2rem; }
      .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }

      /* Loading state — skeleton animations */
      .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

      /* Responsive */
      @media (min-width: 640px) {
        .sm\:block { display: block; }
        .sm\:flex { display: flex; }
        .sm\:pt-14 { padding-top: 3.5rem; }
        .sm\:px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .sm\:text-6xl { font-size: 3.75rem; }
      }

      @media (min-width: 1024px) {
        .lg\:block { display: block; }
        .lg\:text-\[4\.25rem\] { font-size: 4.25rem; }
        .lg\:px-8 { padding-left: 2rem; padding-right: 2rem; }
      }
    </style>

    <!-- The site name Google prints beside the favicon, above the blue result
         link, is read off the homepage only — from (in order) the WebSite
         JSON-LD "name", og:site_name, <title>, headings and application-name.
         When those sources disagree it discards them all and falls back to the
         bare domain, which is why the line read "cardpop.com.au" while they
         variously said "CardPop™ Australia" and "CardPop™".
         Every one of them is now the byte-identical string "CardPop Australia™".
         Keep them in sync: changing one alone reintroduces the domain fallback.
         The ™-free "CardPop Australia" is declared as an alternateName so Google
         still has a plain form on record — it can decline to print a decorative
         character, and if the line ever reverts to the domain, dropping the ™
         from these naming fields (only) is the first thing to try. -->
    <title>CardPop Australia™ | Trading Card Marketplace</title>
    <meta name="description" content="Buy, sell, and trade Pokémon, Magic: The Gathering, Yu-Gi-Oh, and sports cards on CardPop Australia™ — Australia's trusted online trading card marketplace. Browse thousands of listings, check live prices, and shop sealed boxes." />
    <meta name="keywords" content="trading cards Australia, Pokemon cards Australia, buy sell trade cards, MTG Australia, sports cards Australia, card marketplace" />
    <meta name="author" content="CardPop™" />
    <meta name="application-name" content="CardPop Australia™" />
    <!-- Canonical is emitted per-route by SEOHead (apex-normalised) so it never
         conflicts with a static tag. The www host 301-redirects to apex (vercel.json). -->

    <!-- Open Graph (Facebook, Discord, Slack previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cardpop.com.au/" />
    <meta property="og:site_name" content="CardPop Australia™" />
    <meta property="og:title" content="CardPop Australia™ | Australia's Trusted Digital Card Show - Trading Card Marketplace" />
    <meta property="og:description" content="Buy, sell, and trade Pokémon, Magic: The Gathering, sports cards and more on CardPop Australia™ — Australia's most trusted trading card platform." />
    <meta property="og:image" content="https://cardpop.com.au/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@cardpopau" />
    <meta name="twitter:title" content="CardPop Australia™ | Australia's Trusted Digital Card Show - Trading Card Marketplace" />
    <meta name="twitter:description" content="Buy, sell, and trade Pokémon, Magic: The Gathering, sports cards and more on CardPop Australia™ — Australia's most trusted trading card platform." />
    <meta name="twitter:image" content="https://cardpop.com.au/og-image.jpg" />

    <!-- Favicon — CardPop card-holder icon in brand red -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 68' fill='none'><rect x='17' y='0.5' width='22' height='11' rx='4' stroke='%23CE1126' stroke-width='2.5'/><rect x='20.5' y='3' width='15' height='5' rx='2' fill='%23CE1126' opacity='0.22'/><rect x='1.5' y='9' width='53' height='58' rx='6' stroke='%23CE1126' stroke-width='2.5'/><rect x='8' y='17' width='40' height='43' rx='4' stroke='%23CE1126' stroke-width='2'/><rect x='14' y='23' width='28' height='31' rx='2.5' stroke='%23CE1126' stroke-width='1.5' opacity='0.6'/></svg>" />

    <!-- Structured data: Website with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://cardpop.com.au/#website",
      "name": "CardPop Australia™",
      "alternateName": ["CardPop", "CardPop Australia"],
      "publisher": { "@id": "https://cardpop.com.au/#organization" },
      "url": "https://cardpop.com.au",
      "description": "Australia's trading card marketplace for Pokémon, Magic: The Gathering, sports cards and more.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://cardpop.com.au/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://cardpop.com.au/#organization",
      "name": "CardPop Australia™",
      "alternateName": ["CardPop", "CardPop Australia"],
      "url": "https://cardpop.com.au",
      "logo": "https://cardpop.com.au/og-image.jpg",
      "description": "Australia's most trusted trading card marketplace.",
      "address": {
        "@type": "PostalAddress",
        "postOfficeBoxNumber": "1024",
        "addressLocality": "Ascot Vale",
        "addressRegion": "VIC",
        "postalCode": "3032",
        "addressCountry": "AU"
      },
      "sameAs": [
        "https://twitter.com/cardpopau",
        "https://www.facebook.com/profile.php?id=61591488466915"
      ]
    }
    </script>

    <!-- Structured data: OnlineStore for Australia -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "CardPop Australia™",
      "alternateName": ["CardPop", "CardPop Australia"],
      "description": "Australia's most trusted trading card marketplace for Pokémon, Magic: The Gathering, Yu-Gi-Oh and sports cards.",
      "url": "https://cardpop.com.au",
      "currenciesAccepted": "AUD",
      "paymentAccepted": "Credit Card",
      "address": {
        "@type": "PostalAddress",
        "postOfficeBoxNumber": "1024",
        "addressLocality": "Ascot Vale",
        "addressRegion": "VIC",
        "postalCode": "3032",
        "addressCountry": "AU"
      },
      "areaServed": {
        "@type": "Country",
        "name": "Australia"
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": [
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
          "Sunday"
        ],
        "opens": "00:00",
        "closes": "23:59"
      },
      "priceRange": "$$",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Trading Cards",
        "itemListElement": [
          { "@type": "OfferCatalog", "name": "Pokémon Cards" },
          { "@type": "OfferCatalog", "name": "Magic: The Gathering Cards" },
          { "@type": "OfferCatalog", "name": "Yu-Gi-Oh Cards" },
          { "@type": "OfferCatalog", "name": "Sports Cards" }
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
    <!-- Third-party analytics (Google gtag) and affiliate (Impact) scripts are
         loaded from main.jsx after the app is interactive (requestIdleCallback),
         so they never compete with React hydration for the main thread. -->
  </body>
</html>
